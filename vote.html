<!doctype html>
<html lang="en" class="vote">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vote</title>
<link rel="stylesheet" href="theme.css">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
  main{max-width:520px;margin:0 auto;padding:24px 18px 44px;min-height:100dvh;display:flex;flex-direction:column}
  .status{font-size:.8rem;color:var(--muted);margin-bottom:14px}.status b{color:var(--fg)}
  h1{font-size:1.3rem;line-height:1.3;margin:6px 0 20px}
  .opts{display:flex;flex-direction:column;gap:12px}
  button.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;
    border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--fg);font-size:1.05rem;cursor:pointer}
  button.opt .k{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:700}
  button.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  button.opt[aria-pressed="true"] .k{border-color:var(--accent);background:var(--accent);color:#fff}
  .done{margin-top:auto;padding-top:24px;color:var(--muted);font-size:.9rem}.done b{color:var(--accent)}
  .numwrap{margin:14px 0}
  .numval{font-size:3.2rem;font-weight:800;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums;margin-bottom:12px}
  input[type=range]{width:100%;height:40px;accent-color:var(--accent);touch-action:none}
  .numscale{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:2px}
  .joinform{margin:auto 0;display:flex;flex-direction:column;gap:16px}
  .joinform h1{margin:0;text-align:center}
  .roomin{width:100%;box-sizing:border-box;padding:18px;border:2px solid var(--line);border-radius:14px;
    background:transparent;color:var(--fg);font-size:2rem;font-weight:800;text-align:center;
    letter-spacing:.35em;text-indent:.35em;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .roomin:focus{outline:none;border-color:var(--accent)}
  .joinbtn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--accent);color:#fff;
    font-size:1.1rem;font-weight:700;cursor:pointer}
  .joinhint{margin:0;text-align:center;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main id="app"><div class="status">loading…</div></main>
<!-- config.js + the course's polls.js are vendored/copied in next to this file.
     ?v= busts stale phone caches when the toolkit changes — bump on toolkit edits. -->
<script src="lib/supabase.js?v=5"></script>
<script src="config.js?v=5"></script>
<script src="polls.js?v=5"></script>
<script src="poll.js?v=5"></script>
<script>
  var p = new URLSearchParams(location.search);
  var pollId = p.get('poll'), roomParam = p.get('room');
  var app = document.getElementById('app');
  if (!pollId && !roomParam) {                           // opened cold (e.g. site link) → ask for the room code
    Poll.joinPrompt(app, function (code) { location.search = 'room=' + code; });
  } else {
    var room = (roomParam || 'DEMO').toUpperCase();
    if (!pollId) { Poll.follow(app, room); }             // scan once → follow the presenter across polls
    else if (!POLLS[pollId]) { app.innerHTML = '<div class="status">Unknown poll.</div>'; }
    else { Poll.student(app, POLLS[pollId], pollId, room); }   // legacy per-poll link still works
  }
</script>
</body>
</html>
