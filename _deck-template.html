<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DECK TITLE · COURSE</title>
<link rel="stylesheet" href="lib/reveal/reset.css">
<link rel="stylesheet" href="lib/reveal/reveal.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<!-- Copy this file to courses/<C>/slides/reveal/<name>.html and fill in.
     Shared toolkit files (lib/, poll.js, theme.css, config.js, vote.html) are
     vendored in by slides/vendor.sh; polls.js is this course's own. -->
<div class="reveal">
  <div class="slides">

    <section class="title center">
      <div class="course">COURSE · Lecture N</div>
      <h1>DECK TITLE</h1>
      <div class="accentbar" style="margin-left:auto;margin-right:auto"></div>
      <div class="sub">Henrik Sigstad</div>
    </section>

    <!-- Case-driven order: case → numbers → PREDICT poll → reveal tool → resolve → FLIP poll -->
    <section class="center"><h2>Case slide</h2></section>

    <section><div class="pollmount" data-poll="example_poll"></div></section>

    <section><h2>Reveal / resolve</h2></section>

  </div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/reveal/reveal.js"></script>
<script src="config.js"></script>
<script src="polls.js"></script>
<script src="poll.js"></script>
<script src="transcript.js"></script>
<script>
  Reveal.initialize({ hash: true, center: true, controls: false, progress: true,
    slideNumber: false, width: 1280, height: 720, margin: 0.07,
    transition: 'none', backgroundTransition: 'none' });
  // Polls self-wire: poll.js sees the .pollmount(s) and auto-mounts them (scan-once
  // follow QR + phone sync + the R-key results toggle). No per-deck poll call needed.
  Transcript.deck();   // adds the "Vis transkript" toggle when the deck has a transcript
</script>
</body>
</html>
